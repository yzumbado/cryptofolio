name: Agent Evals (live)

# LLM-in-the-loop behavioral evals for the MCP agent. Non-deterministic, so this
# runs manually (workflow_dispatch) or nightly — never as a blocking PR gate.
# Requires the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # nightly at 07:00 UTC

jobs:
  live-evals:
    name: LLM scenario evals
    runs-on: ubuntu-latest
    # Informational — a flaky run or model regression must not fail the pipeline.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build cryptofolio binary
        run: cargo build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json

      - name: Install + build MCP server
        working-directory: mcp
        run: |
          npm ci
          npm run build

      - name: Run live agent evals
        working-directory: mcp
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRYPTOFOLIO_BIN: ${{ github.workspace }}/target/debug/cryptofolio
          MCP_SERVER_ENTRY: ${{ github.workspace }}/mcp/dist/index.js
        run: npm run eval

      - name: Upload eval transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-transcripts
          path: mcp/evals/results/
          if-no-files-found: ignore
