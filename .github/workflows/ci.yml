name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Nightly at 06:00 UTC — runs integration tests against real blockchain APIs
    - cron: '0 6 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: unwrap gate
      run: bash scripts/check_unwraps.sh

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests
      run: cargo test --lib --verbose

    - name: Run integration tests
      run: |
        cargo test --test bdd --verbose
        cargo test --test binance_sync --verbose
        cargo test --test currency_integration --verbose
        cargo test --test import_export_integration --verbose
        cargo test --test pnl_integration --verbose
        cargo test --test transaction_integration --verbose

    - name: Run doc tests
      run: cargo test --doc --verbose

  build:
    name: Build Release Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cryptofolio
            asset_name: cryptofolio-linux-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cryptofolio
            asset_name: cryptofolio-macos-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        if-no-files-found: error


  mcp-test:
    name: MCP TypeScript Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: mcp/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npm run typecheck
    - name: Eval harness typecheck
      run: npm run eval:typecheck
    - name: Lint
      run: npm run lint
    - name: Run tests
      run: npm test
    - name: Agent-eval harness self-test (mock — no API key)
      run: npm run eval:mock

  coverage:
    name: Coverage Report (non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking — coverage is informational; do not fail the build
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Rust coverage (summary only)
      run: cargo llvm-cov --lib --summary-only

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: mcp/package-lock.json

    - name: Install MCP dependencies
      run: npm ci
      working-directory: mcp

    - name: MCP coverage (summary only)
      run: npm run test:coverage
      working-directory: mcp

  integration:
    name: Integration Tests (Real APIs)
    runs-on: ubuntu-latest
    # Only run on the nightly schedule trigger, not on push/PR
    if: github.event_name == 'schedule'
    # Non-blocking — a transient API outage should not fail the build
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}

    - name: Run blockchain client integration tests
      env:
        CRYPTOFOLIO_INTEGRATION_TESTS: "1"
        BLOCKFROST_API_KEY: ${{ secrets.BLOCKFROST_API_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      run: cargo test --test blockchain_clients -- --nocapture
