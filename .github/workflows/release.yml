name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

  build-release:
    name: Build Release Binaries
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cryptofolio
            asset_name: cryptofolio-linux-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cryptofolio
            asset_name: cryptofolio-macos-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Strip binary
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Compress binary
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
        cd -

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz

  build-docker:
    name: Build and Push Docker Image
    needs: create-release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Gate Docker publishing on whether the Docker Hub secret is configured.
    # NOTE: `secrets.*` is NOT allowed in step/job `if:` expressions — doing so
    # makes GitHub reject the whole workflow file (a 0s "workflow file issue"
    # failure on EVERY push). Promote the secret to an env var in a plain step
    # and branch on that env var instead.
    - name: Detect Docker credentials
      id: docker_creds
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        if [ -n "$DOCKER_USERNAME" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      if: steps.docker_creds.outputs.enabled == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: steps.docker_creds.outputs.enabled == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract version from tag
      if: steps.docker_creds.outputs.enabled == 'true'
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      if: steps.docker_creds.outputs.enabled == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/cryptofolio:${{ steps.get_version.outputs.VERSION }}
          ${{ secrets.DOCKER_USERNAME }}/cryptofolio:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
