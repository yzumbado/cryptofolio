[package]
name = "cryptofolio"
version = "0.4.0"
edition = "2021"
description = "A CLI tool for managing crypto portfolios across exchanges and wallets"
license = "MIT"

[lib]
name = "cryptofolio"
path = "src/lib.rs"

[[bin]]
name = "cryptofolio"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI framework
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Financial precision
rust_decimal = { version = "1", features = ["serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Config paths
dirs = "5"

# Terminal output
colored = "2"
indicatif = "0.17"

# TTY detection
is-terminal = "0.4"

# Hidden password input
rpassword = "7"

# String similarity (for "did you mean?")
strsim = "0.11"

# Environment variables
dotenvy = "0.15"

# Error handling
thiserror = "2"

# CSV parsing
csv = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Binance authentication (HMAC-SHA256)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Address validation (Bech32 for Cardano, etc.)
bech32 = "0.11"

# Bitcoin BIP32 HD wallet key derivation and address generation
bitcoin = "0.32"

# BLAKE2 hashing (Cardano CIP-14 asset fingerprints)
blake2 = "0.10"

# Interactive shell
rustyline = { version = "14", features = ["derive"] }
shell-words = "1"

# Regex for pattern matching
regex = "1"

# macOS Keychain integration (conditional)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.9"
core-foundation = "0.9"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
cucumber = "0.20"
anyhow = "1"
wiremock = "0.6"

[[test]]
name = "bdd"
harness = false
